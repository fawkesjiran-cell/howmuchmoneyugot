appId: com.fawkesjiran.jinzhang.electron
productName: How Much Money U Got
asar: true
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - src/**/*
  - package.json
extraResources:
  - from: build
    to: tray
    filter:
      - "tray*"
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
artifactName: How-Much-Money-U-Got-${version}-${os}-${arch}.${ext}
mac:
  artifactName: How-Much-Money-U-Got-${version}-macOS-Electron-${arch}.${ext}
  category: public.app-category.productivity
  icon: build/icon.icns
  minimumSystemVersion: "12.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  extendInfo:
    LSUIElement: true
win:
  artifactName: How-Much-Money-U-Got-${version}-Windows-Electron-${arch}.${ext}
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: How-Much-Money-U-Got-Setup-${version}.${ext}
publish:
  provider: github
  owner: fawkesjiran-cell
  repo: howmuchmoneyugot
