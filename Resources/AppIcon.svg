<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 320 320" role="img" aria-label="Daily accounting app icon: a pale pink heartbeat pulse line peaking in a gold coin on a red ground" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
