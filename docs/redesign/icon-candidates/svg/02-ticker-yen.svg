<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Big Sur squircle contact drop shadow beneath tile -->
    <filter id="tile-drop-shadow" x="-20%" y="-20%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="36" stdDeviation="30" flood-color="#05140e" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#05140e" flood-opacity="0.14" />
    </filter>

    <!-- Deep pine green squircle gradient with subtle top light -->
    <linearGradient id="pineTileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#146B4A" />
      <stop offset="42%" stop-color="#104D36" />
      <stop offset="100%" stop-color="#0F3D2E" />
    </linearGradient>

    <!-- Machined edge highlight stroke -->
    <linearGradient id="tileRimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#05140E" stop-opacity="0.32" />
    </linearGradient>

    <!-- Cream split-flap segment gradient with subtle machined top light -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EC" />
      <stop offset="100%" stop-color="#F3EBDD" />
    </linearGradient>

    <!-- Ember orange active split-flap segment gradient -->
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D96923" />
      <stop offset="100%" stop-color="#C25A17" />
    </linearGradient>

    <!-- Subtle machined tactile shadow under the glyph -->
    <filter id="mark-depth" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#05140E" flood-opacity="0.36" />
    </filter>
  </defs>

  <!-- Presentation Background: Plain warm off-white #F3F6F4 -->
  <rect width="1024" height="1024" fill="#F3F6F4" />

  <!-- macOS Big Sur Squircle Tile (~74% of 1024 = 758px, centered at 512, 512 -> x=133, y=133, rx=172) -->
  <g filter="url(#tile-drop-shadow)">
    <!-- Base Squircle tile in deep pine gradient -->
    <rect x="133" y="133" width="758" height="758" rx="172" ry="172" fill="url(#pineTileGrad)" />
    <!-- Machined edge highlight border -->
    <rect x="133" y="133" width="758" height="758" rx="172" ry="172" fill="none" stroke="url(#tileRimStroke)" stroke-width="3" />
  </g>

  <!--
    ========================================================================
    CONCEPT "Ticker Yen": Clean Yen with One Live Segment

    Dimensions & Grid:
    - Tile: 758px x 758px, bounds: X: [133, 891], Y: [133, 891], center: (512, 512).
    - 3% minimum detail rule: 758 * 0.03 = 22.74px. Every stroke width is >= 52px!
    - Glyph width: ~48% of tile width = 758 * 0.48 = 364px (X: 330 to 694).
    - Continuous vertical stem: width = 56px (X: 484 to 540), perfectly centered at X = 512.
    - Two 45-degree arms:
      - Apex / V-junction meets cleanly at stem top: Center apex (512, 474).
      - Left arm top tip at (330, 292) to (370, 292).
      - Right arm top tip at (654, 292) to (694, 292).
      - Total top arm span = 364px.
    - Two horizontal crossbars:
      - Exactly equal width, centered on stem: width = 236px (X: 394 to 630).
      - Height = 48px each.
      - Even spacing:
        Upper crossbar: Y = 502 to 550.
        Lower crossbar: Y = 580 to 628.
        Vertical stem extends from junction (Y = 474) down to bottom terminal (Y = 732).
    - Exactly TWO hairline seams:
      1. Diagonal hairline seam separating the lower half of the left arm (ember orange #C25A17)
         from the upper half of the left arm (cream #F3EBDD).
      2. Horizontal hairline seam near the bottom of the stem (at Y = 668).
    - The lower-left arm segment is ember orange (#C25A17).
    - Everything else is solid cream (#F3EBDD).
    - Unbroken, bold Yen silhouette, perfectly legible at 16x16 px!
    ========================================================================
  -->

  <g id="ticker-yen-glyph" filter="url(#mark-depth)">

    <!-- ================= 1. RIGHT DIAGONAL ARM (Cream) ================= -->
    <!-- Solid, continuous 45° diagonal arm from (694, 292) down to apex junction at (512, 474) -->
    <path d="M 694 292
             L 640 292
             L 512 420
             L 512 474
             L 538 474
             L 694 318 Z"
          fill="url(#creamGrad)" />

    <!-- ================= 2. LEFT DIAGONAL ARM - UPPER HALF (Cream) ================= -->
    <!-- Extends from top left tip (330, 292) down to diagonal split seam at (398, 360) - (438, 360) -->
    <path d="M 330 292
             L 384 292
             L 444 352
             L 390 352 Z"
          fill="url(#creamGrad)" />

    <!-- ================= 3. LEFT DIAGONAL ARM - LOWER HALF (EMBER ORANGE #C25A17) ================= -->
    <!-- The single live split-flap segment: from seam at Y = 354 down to junction apex at (512, 474) -->
    <path d="M 390 355
             L 444 355
             L 512 423
             L 512 474
             L 486 474
             L 390 378 Z"
          fill="url(#emberGrad)" />
    <!-- Subtle top bevel highlight on the ember segment -->
    <line x1="390" y1="355" x2="444" y2="355" stroke="#FFE2D1" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- ================= 4. STEM - MAIN UPPER SECTION (Cream) ================= -->
    <!-- Runs continuously through junction and crossbars down to horizontal hairline seam at Y = 668 -->
    <rect x="484" y="474" width="56" height="194" fill="url(#creamGrad)" />

    <!-- ================= 5. UPPER HORIZONTAL CROSSBAR (Cream) ================= -->
    <!-- Equal width 236px (X: 394 to 630), height 48px (Y: 502 to 550), centered at X = 512 -->
    <rect x="394" y="502" width="236" height="48" rx="4" fill="url(#creamGrad)" />

    <!-- ================= 6. LOWER HORIZONTAL CROSSBAR (Cream) ================= -->
    <!-- Equal width 236px (X: 394 to 630), height 48px (Y: 580 to 628), centered at X = 512 -->
    <rect x="394" y="580" width="236" height="48" rx="4" fill="url(#creamGrad)" />

    <!-- ================= 7. STEM - LOWER TIP FLAP (Cream) ================= -->
    <!-- Below horizontal seam at Y = 670 down to Y = 732, with subtle bottom rounded terminal -->
    <rect x="484" y="671" width="56" height="61" rx="5" fill="url(#creamGrad)" />

    <!--
      ========================================================================
      EXACTLY TWO MECHANICAL HAIRLINE SEAMS:
      1. Diagonal seam on the left arm: separating upper cream from lower ember segment.
      2. Horizontal seam near the bottom of the stem: separating upper stem from lower flap.
      Constructed with crisp pine shadow groove and subtle bottom rim highlight.
      ========================================================================
    -->
    <g id="two-hairline-seams">
      <!-- Seam 1: Left arm diagonal division seam (along Y = 353.5) -->
      <line x1="388" y1="353.5" x2="446" y2="353.5" stroke="#0F3D2E" stroke-width="2.5" />
      <line x1="388" y1="355" x2="446" y2="355" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.4" />

      <!-- Seam 2: Stem bottom horizontal division seam (at Y = 669.5) -->
      <line x1="484" y1="669.5" x2="540" y2="669.5" stroke="#0F3D2E" stroke-width="2.5" />
      <line x1="484" y1="671" x2="540" y2="671" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.5" />
    </g>

  </g>
</svg>