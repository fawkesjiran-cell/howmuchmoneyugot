<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Big Sur squircle contact drop shadow -->
    <filter id="tile-drop-shadow" x="-25%" y="-20%" width="150%" height="155%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="36" stdDeviation="30" flood-color="#05140e" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#05140e" flood-opacity="0.14" />
    </filter>

    <!-- Deep pine green squircle gradient with subtle top light -->
    <linearGradient id="pineTileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#146B4A" />
      <stop offset="45%" stop-color="#104D36" />
      <stop offset="100%" stop-color="#0F3D2E" />
    </linearGradient>

    <!-- Machined inner edge highlight stroke -->
    <linearGradient id="tileRimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#05140E" stop-opacity="0.32" />
    </linearGradient>

    <!-- Cream circular dial gradient -->
    <linearGradient id="creamDialGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EC" />
      <stop offset="100%" stop-color="#F3EBDD" />
    </linearGradient>

    <!-- Thin dark pine dial rim gradient -->
    <linearGradient id="dialRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#146B4A" />
      <stop offset="100%" stop-color="#0F3D2E" />
    </linearGradient>

    <!-- Embossed Yen shadow/bevel filter -->
    <filter id="yen-emboss" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#05140E" flood-opacity="0.18" />
    </filter>

    <!-- Gauge arc glow/clean filter -->
    <filter id="gauge-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#05140E" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Presentation Background: Warm off-white #F3F6F4 -->
  <rect width="1024" height="1024" fill="#F3F6F4" />

  <!-- macOS Big Sur Squircle Tile (74% of canvas = 758px, centered at 512, 512 -> x=133, y=133) -->
  <g filter="url(#tile-drop-shadow)">
    <!-- Base Squircle in pine gradient -->
    <rect x="133" y="133" width="758" height="758" rx="172" ry="172" fill="url(#pineTileGrad)" />
    <!-- Machined edge highlight border -->
    <rect x="133" y="133" width="758" height="758" rx="172" ry="172" fill="none" stroke="url(#tileRimStroke)" stroke-width="3" />
  </g>

  <!--
    GAUGE & DIAL GEOMETRY:
    Center: (512, 512)
    Tile width: 758px.
    3% minimum detail threshold: ~22.8px.
    Dial diameter: ~56% of tile = 758 * 0.56 = 424.48px -> radius R_dial = 212px.
    Dial thin pine rim: stroke-width = 8px, R = 212px.

    Upper Gauge Arc:
    Concentric with dial, running outside dial from 9 o'clock (180°) to 3 o'clock (0° / 360°).
    Radius R_arc = 270px.
    Arc path: from (512 - 270, 512) = (242, 512) to (512 + 270, 512) = (782, 512).
    Arc stroke: #F3EBDD, stroke-width = 6px.

    7 Radial Tick Marks:
    Evenly spaced across 180° semi-circle: 180°, 150°, 120°, 90°, 60°, 30°, 0°.
    Clock positions:
    - 9 o'clock: 180° (cream)
    - 10 o'clock: 150° (cream)
    - 11 o'clock: 120° (cream)
    - 12 o'clock: 90° (cream)
    - 1 o'clock: 60° (EMBER ORANGE #C25A17, slightly longer!)
    - 2 o'clock: 30° (cream)
    - 3 o'clock: 0° (cream)

    Standard ticks length: 26px (across R_arc = 270: r_inner = 257, r_outer = 283). Width = 6px.
    1 o'clock tick (60°): ember #C25A17, length: 38px (r_inner = 251, r_outer = 289). Width = 7px.
  -->

  <g id="pine-gauge" filter="url(#gauge-shadow)">
    <!-- Thin cream circular arc over upper half (9 o'clock to 3 o'clock) -->
    <path d="M 242 512 A 270 270 0 0 1 782 512" fill="none" stroke="#F3EBDD" stroke-width="6" stroke-linecap="round" />

    <!-- 7 Radial Tick Marks -->
    <!-- 1. 9 o'clock (180°): from x = 512 - 283 = 229, y=512 to x = 512 - 257 = 255, y=512 -->
    <line x1="229" y1="512" x2="255" y2="512" stroke="#F3EBDD" stroke-width="6" stroke-linecap="round" />

    <!-- 2. 10 o'clock (150°): cos(150°) = -0.8660, sin(150°) = 0.5 (upward -> y = 512 - r*0.5) -->
    <!-- r_inner = 257: x = 512 - 222.6 = 289.4, y = 512 - 128.5 = 383.5 -->
    <!-- r_outer = 283: x = 512 - 245.1 = 266.9, y = 512 - 141.5 = 370.5 -->
    <line x1="267" y1="370.5" x2="289.5" y2="383.5" stroke="#F3EBDD" stroke-width="6" stroke-linecap="round" />

    <!-- 3. 11 o'clock (120°): cos(120°) = -0.5, sin(120°) = 0.8660 -->
    <!-- r_inner = 257: x = 512 - 128.5 = 383.5, y = 512 - 222.6 = 289.4 -->
    <!-- r_outer = 283: x = 512 - 141.5 = 370.5, y = 512 - 245.1 = 266.9 -->
    <line x1="370.5" y1="267" x2="383.5" y2="289.5" stroke="#F3EBDD" stroke-width="6" stroke-linecap="round" />

    <!-- 4. 12 o'clock (90°): straight up -->
    <!-- r_inner = 257: y = 512 - 257 = 255 -->
    <!-- r_outer = 283: y = 512 - 283 = 229 -->
    <line x1="512" y1="229" x2="512" y2="255" stroke="#F3EBDD" stroke-width="6" stroke-linecap="round" />

    <!-- 5. 1 o'clock (60°): EMBER ORANGE #C25A17, slightly longer (r_inner = 251, r_outer = 289) -->
    <!-- cos(60°) = 0.5, sin(60°) = 0.8660 -->
    <!-- r_inner = 251: x = 512 + 125.5 = 637.5, y = 512 - 217.4 = 294.6 -->
    <!-- r_outer = 289: x = 512 + 144.5 = 656.5, y = 512 - 250.3 = 261.7 -->
    <line x1="637.5" y1="294.6" x2="656.5" y2="261.7" stroke="#C25A17" stroke-width="7" stroke-linecap="round" />

    <!-- 6. 2 o'clock (30°): cos(30°) = 0.8660, sin(30°) = 0.5 -->
    <!-- r_inner = 257: x = 512 + 222.6 = 734.6, y = 512 - 128.5 = 383.5 -->
    <!-- r_outer = 283: x = 512 + 245.1 = 757.1, y = 512 - 141.5 = 370.5 -->
    <line x1="734.6" y1="383.5" x2="757.1" y2="370.5" stroke="#F3EBDD" stroke-width="6" stroke-linecap="round" />

    <!-- 7. 3 o'clock (0°): from x = 512 + 257 = 769, y=512 to x = 512 + 283 = 795, y=512 -->
    <line x1="769" y1="512" x2="795" y2="512" stroke="#F3EBDD" stroke-width="6" stroke-linecap="round" />
  </g>

  <!--
    CENTERED CREAM DIAL
    Diameter: 424px (~56% of tile), radius = 212px.
    Center: (512, 512).
    Thin dark pine rim: #0F3D2E.
  -->
  <g id="cream-dial">
    <!-- Base cream disc -->
    <circle cx="512" cy="512" r="212" fill="url(#creamDialGrad)" />

    <!-- Thin dark pine rim -->
    <circle cx="512" cy="512" r="212" fill="none" stroke="url(#dialRimGrad)" stroke-width="7" />

    <!-- Gentle inner coin lip for subtle machined depth -->
    <circle cx="512" cy="512" r="204" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" />
  </g>

  <!--
    EMBOSSED YEN SIGN (¥)
    In deep pine green (#0F3D2E).
    Stroke weight: ~11% of dial diameter (424 * 0.11 = ~46.6px -> 46px).
    Flat terminals. Bold geometric precision.
    Optically balanced at center (512, 512).
    Height: ~250px (y: ~387 to ~637).
    Upper arms spread: ~240px wide.
    Crossbars:
      Upper crossbar: width ~180px, height 46px, y = 492
      Lower crossbar: width ~148px, height 46px, y = 556
    Stem:
      width 46px, height ~145px, x = 489 to 535, y = 492 to 637
    Diagonal arms:
      Apex meets at (512, 500).
      Flat perpendicular top cut terminals.
  -->
  <g id="embossed-yen" fill="#0F3D2E" filter="url(#yen-emboss)">
    <!-- Vertical stem with flat bottom terminal -->
    <rect x="489" y="492" width="46" height="145" rx="0" />

    <!-- Upper crossbar with flat terminals -->
    <rect x="422" y="492" width="180" height="46" rx="0" />

    <!-- Lower crossbar with flat terminals -->
    <rect x="438" y="556" width="148" height="46" rx="0" />

    <!-- Left diagonal arm (polygon with flat horizontal or perpendicular top terminal) -->
    <!-- Center junction apex at (512, 505). Arm thickness = 46px along perpendicular -->
    <!-- Top left edge at x=400, y=390 to x=436, y=390; angled down to center -->
    <polygon points="392,392 436,392 516,494 482,514" />

    <!-- Right diagonal arm -->
    <polygon points="632,392 588,392 508,494 542,514" />
  </g>
</svg>