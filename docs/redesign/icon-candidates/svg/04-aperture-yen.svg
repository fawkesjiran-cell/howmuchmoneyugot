<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Big Sur squircle contact drop shadow beneath tile -->
    <filter id="tile-drop-shadow" x="-20%" y="-20%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="36" stdDeviation="30" flood-color="#05140e" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#05140e" flood-opacity="0.14" />
    </filter>

    <!-- Deep pine green squircle gradient with subtle top light -->
    <linearGradient id="pineTileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#146B4A" />
      <stop offset="42%" stop-color="#104D36" />
      <stop offset="100%" stop-color="#0F3D2E" />
    </linearGradient>

    <!-- Machined inner edge highlight stroke -->
    <linearGradient id="tileRimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#05140E" stop-opacity="0.32" />
    </linearGradient>

    <!-- Cream aperture disc gradient with subtle top light -->
    <linearGradient id="creamDiscGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EC" />
      <stop offset="100%" stop-color="#F3EBDD" />
    </linearGradient>

    <!-- Ember orange accent dot gradient -->
    <linearGradient id="emberDotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D96923" />
      <stop offset="100%" stop-color="#C25A17" />
    </linearGradient>

    <!-- Subtle machined shadow under disc on pine tile -->
    <filter id="disc-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#05140E" flood-opacity="0.3" />
    </filter>

    <!--
      APERTURE YEN MASK
      Tile size = 758px (centered at 512, 512).
      Disc diameter = 62% of tile = 758 * 0.62 = 470px (Radius R = 235px).
      Stroke weight = 12% of disc diameter = 470 * 0.12 = 56.4px -> 56px (strict > 22.7px 3% rule).

      Yen geometry (in mask black to cut out of white disc):
      - Both horizontal crossbars of equal width and strictly centered on the vertical stem (at X = 512).
      - Crossbar width: 280px (X: 372 to 652).
      - Stem: width 56px (X: 484 to 540), extending from junction at Y = 490 down to Y = 660.
      - Upper crossbar: Y = 490 to 546 (centered at Y = 518).
      - Lower crossbar: Y = 570 to 626 (centered at Y = 598).
      - V-arms: meet stem cleanly at (512, 490).
        Top left terminal at (380, 360), top right terminal at (644, 360).
    -->
    <mask id="disc-yen-mask">
      <!-- White base disc -->
      <circle cx="512" cy="512" r="235" fill="#FFFFFF" />

      <!-- Cutout Yen sign in black -->
      <g fill="#000000">
        <!-- Vertical Stem -->
        <rect x="484" y="490" width="56" height="170" rx="4" />

        <!-- Upper Horizontal Crossbar (strictly centered on stem, equal width) -->
        <rect x="372" y="490" width="280" height="56" rx="4" />

        <!-- Lower Horizontal Crossbar (strictly centered on stem, equal width: 280px) -->
        <rect x="372" y="570" width="280" height="56" rx="4" />

        <!-- Upper Left Diagonal Arm -->
        <polygon points="340,360 396,360 540,510 484,510" />

        <!-- Upper Right Diagonal Arm -->
        <polygon points="684,360 628,360 484,510 540,510" />
      </g>
    </mask>
  </defs>

  <!-- Presentation Background: Warm off-white #F3F6F4 -->
  <rect width="1024" height="1024" fill="#F3F6F4" />

  <!-- macOS Big Sur Squircle Tile (~74% of canvas = 758px, centered at 512, 512 -> x=133, y=133) -->
  <g filter="url(#tile-drop-shadow)">
    <!-- Base Squircle tile in deep pine gradient -->
    <rect x="133" y="133" width="758" height="758" rx="172" ry="172" fill="url(#pineTileGrad)" />
    <!-- Machined edge highlight border -->
    <rect x="133" y="133" width="758" height="758" rx="172" ry="172" fill="none" stroke="url(#tileRimStroke)" stroke-width="3" />
  </g>

  <!--
    ========================================================================
    CONCEPT "Aperture Yen": The Reductive Mark
    Three elements only:
    1. Pine green squircle tile.
    2. Cream disc (~62% tile = 470px diameter) with negative space Yen cutout.
       - Yen crossbars strictly equal width and centered on the vertical stem.
       - Pine background shows cleanly through the cutout.
    3. Ember orange status dot (~3.5% of disc diameter = ~16.5px diameter)
       positioned exactly on the disc rim at 1:30 (45° angle from horizontal / +X axis).
       Angle: -45° (or 315°), center = (512 + R*cos(-45°), 512 + R*sin(-45°)).
       R = 235px -> cos(45°) = 0.7071
       cx = 512 + 235 * 0.7071 = 512 + 166.17 = 678.2
       cy = 512 - 235 * 0.7071 = 512 - 166.17 = 345.8
    ========================================================================
  -->

  <!-- Cream Aperture Disc with Yen Cutout -->
  <g filter="url(#disc-shadow)">
    <circle cx="512" cy="512" r="235" fill="url(#creamDiscGrad)" mask="url(#disc-yen-mask)" />
  </g>

  <!--
    Ember Orange Circular Status Dot:
    - Diameter: ~3.5% of 470px disc = 16.5px (radius r = 8.25px).
    - Position: Exactly on the disc rim at 1:30 (45 degrees above positive x-axis).
    - Center coordinates: (678.2, 345.8).
  -->
  <circle cx="678.2" cy="345.8" r="8.25" fill="url(#emberDotGrad)" />
</svg>