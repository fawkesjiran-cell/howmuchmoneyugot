name: Electron CI

on:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - ".github/workflows/electron-ci.yml"
  pull_request:
    paths:
      - "electron/**"
      - ".github/workflows/electron-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install
        run: npm ci
      - name: Test core and persistence
        run: npm test
